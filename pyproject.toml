# Dev-only tooling env: the pytest suite in tests/ and the inventory compiler in
# tools/inventory (`uv run render`). Never deployed (pyproject.toml, uv.lock,
# .venv, tools/, tests/ are in .chezmoiignore).
[project]
name = "chezmoi-dev"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
]

[project.scripts]
render = "inventory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/inventory"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ty",
    "ruff",
    "yamllint>=1.38.0",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
    "pytest-xdist>=3.8.0",
    "zizmor>=1.31.0",
]

# A floor, not a pin: uv is kept at the latest by its own installer.
[tool.uv]
required-version = ">=0.13"
# The release cooldown, here as well as in the user's uv.toml: CI and Renovate have only
# this file, and the lock records it.
exclude-newer = "P7D"
# trust-store data: every release is a revocation, the cooldown only delays it
exclude-newer-package = { certifi = false }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "PTH", "C4", "SIM", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["inventory"]

[tool.deptry]
known_first_party = ["inventory"]

# tools/vendor/ is a directory of PEP 723 scripts sharing _upstream.py, not a package: the
# tests and the type checker import them the way `uv run --script` does, by directory.
[tool.pytest.ini_options]
pythonpath = ["tools/vendor"]

[tool.ty.environment]
extra-paths = ["tools/vendor"]
