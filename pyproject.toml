# Dev-only tooling env: the pytest suite in tests/ and the inventory compiler in
# tools/inventory (`uv run render`). Never deployed (pyproject.toml, uv.lock,
# .venv, tools/, tests/ are in .chezmoiignore).
[project]
name = "chezmoi-dev"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
render = "inventory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/inventory"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ty",
    "ruff",
    "yamllint>=1.38.0",
]

[tool.ruff]
line-length = 100
extend-include = ["dot_claude/modify_settings.json", "run_onchange_after_snapshot-claude-managed.py.tmpl"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "PTH", "C4", "SIM", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["inventory"]
