# Run with prek. Never deployed: chezmoi skips source-dir dotfiles that are
# not .chezmoi*.
repos:
  # prek's built-in reimplementations of pre-commit-hooks — offline, no setup.
  # Not enabled on purpose: check-shebang-scripts-are-executable (chezmoi's
  # run_/executable_ prefixes make scripts executable at apply time, not in
  # the source tree), no-commit-to-branch (this repo commits to main).
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: fix-byte-order-marker
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-added-large-files
      - id: detect-private-key

  # Local tools from the repo's uv dev env, so versions match `uv run` in the shell.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        pass_filenames: false
        files: ^(tests/.*\.py|tools/.*\.py|pyproject\.toml)$

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        pass_filenames: false
        files: ^(tests/.*\.py|tools/.*\.py|pyproject\.toml)$

      # .schema/ is committed for the editor.
      - id: render-schema
        name: render schema
        entry: uv run render schema
        language: system
        pass_filenames: false
        files: ^(tools/inventory/|\.schema/|uv\.lock$)

      # Pinned by the repo's mise.toml, like oxfmt: rules change between releases.
      - id: shellcheck
        name: shellcheck
        entry: mise x -- shellcheck
        language: system
        files: \.sh$

      # Scoped to the files that already conform; the rest of the tree (skills
      # markdown, vendored configs) has never been oxfmt-formatted. Pinned by the
      # repo's mise.toml, which the shell may not have activated.
      - id: oxfmt
        name: oxfmt
        entry: mise x -- oxfmt --write
        language: system
        files: ^(\.chezmoidata/.*\.toml|\.pre-commit-config\.yaml|\.yamllint\.yaml)$

      - id: yamllint
        name: yamllint
        entry: uv run yamllint --strict
        language: system
        files: \.ya?ml$

      # Pinned by the repo's mise.toml, which the shell may not have activated.
      - id: jactionlint
        name: jactionlint
        entry: mise x -- jactionlint
        language: system
        pass_filenames: false
        files: ^(\.github/|mise\.toml$)

      - id: zizmor
        name: zizmor
        entry: uv run zizmor --offline
        language: system
        files: ^\.github/workflows/
