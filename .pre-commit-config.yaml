# Run with prek. Never deployed: chezmoi skips source-dir dotfiles that are
# not .chezmoi*.
repos:
  # prek's built-in reimplementations of pre-commit-hooks — offline, no setup.
  # Not enabled on purpose: check-shebang-scripts-are-executable (chezmoi's
  # run_/executable_ prefixes make scripts executable at apply time, not in
  # the source tree), no-commit-to-branch (this repo commits to main).
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: fix-byte-order-marker
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-added-large-files
      - id: detect-private-key

  # Local tools from the repo's uv dev env, so versions match `uv run` in the shell.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        pass_filenames: false
        files: ^(tests/.*\.py|tools/.*\.py|pyproject\.toml)$

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        pass_filenames: false
        files: ^(tests/.*\.py|tools/.*\.py|pyproject\.toml)$

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: \.sh$

      # Scoped to the files that already conform; the rest of the tree (skills
      # markdown, vendored configs) has never been oxfmt-formatted.
      - id: oxfmt
        name: oxfmt
        entry: oxfmt --write
        language: system
        files: ^(\.chezmoidata/.*\.toml|\.pre-commit-config\.yaml|\.yamllint\.yaml)$

      - id: yamllint
        name: yamllint
        entry: uv run yamllint --strict
        language: system
        files: \.ya?ml$

      # Pinned by the repo's mise.toml, which the shell may not have activated.
      - id: jactionlint
        name: jactionlint
        entry: mise x -- jactionlint
        language: system
        pass_filenames: false
        files: ^(\.github/|mise\.toml$)

      # `make test`, the same entry a person runs (Makefile). files: what the tests read.
      - id: pytest
        name: pytest
        entry: make -s test
        language: system
        pass_filenames: false
        files: ^(Makefile|tests/|tools/|claude-managed\.d/|\.chezmoiignore|\.chezmoitemplates/|\.chezmoidata/|pyproject\.toml|uv\.lock|run_onchange_before_install-packages\.sh\.tmpl|run_onchange_after_refresh-completions\.sh\.tmpl|dot_claude/|run_onchange_after_snapshot-claude-managed\.py\.tmpl|dot_config/mise/(config\.toml\.tmpl|tasks/)|dot_Brewfile\.tmpl)
