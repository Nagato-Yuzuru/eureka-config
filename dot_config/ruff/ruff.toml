target-version = "py312"

[lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "UP",   # pyupgrade
  "I",    # isort
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
  "C4",   # flake8-comprehensions
  "RUF",  # ruff 
  "A",    # flake8-builtins
  "T20",  # flake8-print
  "PIE",  # flake8-pie
  "PLC",  # pylint convention
  "PLE",  # pylint error
  "PERF", # perflint
  "FURB", # refurb
]
fixable = ["ALL"]
unfixable = ["T20"]

[lint.per-file-ignores]
"tests/**" = ["T20", "S101"]
"__init__.py" = ["F401"]
"scripts/**" = ["T20"]
