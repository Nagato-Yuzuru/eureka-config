"$schema" = 'https://starship.rs/config-schema.json'

# ------------------------------------------------------------------------------
# 核心格式配置
# ------------------------------------------------------------------------------
format = """
[ ](fg:color_orange bg:color_orange)\
$os\
$username\
[](bg:color_yellow fg:color_orange)\
$directory\
[](fg:color_yellow bg:color_aqua)\
$git_branch\
$git_metrics\
$git_status\
[](fg:color_aqua bg:color_blue)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:color_blue bg:color_bg3)\
$docker_context\
$conda\
[](fg:color_bg3 bg:color_bg1)\
$cmd_duration\
$status\
$time\
[ ](fg:color_bg1)\
$character"""

palette = 'mygruvbox'

# ------------------------------------------------------------------------------
# 可选：Transient Prompt (瞬态提示符)
# 启用后，命令执行后旧的提示符会变为空，保持界面整洁。
# 去掉下面两行的 # 号即可启用
# ------------------------------------------------------------------------------
# [transient_prompt]
# template = '[ ](fg:color_bg1)'

[palettes.mygruvbox]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

[os]
disabled = false
style = "bg:color_orange fg:color_fg0"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bg:color_orange fg:color_fg0"
style_root = "bg:color_orange fg:color_fg0"
format = '[ $user ]($style)'

[directory]
style = "fg:color_fg0 bg:color_yellow"
format = "[ $path ]($style)[$redonly]($read_only_style)"
home_symbol = ' '
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true

[directory.substitutions]
# 注意：如果修改了 home_symbol，这里的替换规则也需要对应修改
" /Documents" = "󰈙 "
" /Downloads" = " "
" /Music" = "󰝚 "
" /Pictures" = " "
" /Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:color_aqua"
format = '[[ $symbol $branch ](fg:color_fg0 bg:color_aqua)]($style)'

[git_metrics]
added_style = "bold fg:color_bg1 bg:color_aqua"
deleted_style = "bold fg:color_red bg:color_aqua"
only_nonzero_diffs = true
disabled = false
format = '([+$added]($added_style))([-$deleted]($deleted_style))'

[git_status]
style = "bg:color_aqua"

conflicted = " "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = "✓"
untracked = " "
stashed = " "
modified = " "
staged = " "
renamed = " "
deleted = " "

format = '[[($all_status$ahead_behind )](fg:color_fg0 bg:color_aqua)]($style)'

[nodejs]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[c]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[rust]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[golang]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[php]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[java]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[kotlin]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[haskell]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[python]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

# ------------------------------------------------------------------------------
# 工具/环境模块
# ------------------------------------------------------------------------------

[docker_context]
symbol = ""
style = "bg:color_bg3"
# 优化：使用 palette 变量 color_blue (原为硬编码 #83a598)
format = '[[ $symbol( $context) ](fg:color_blue bg:color_bg3)]($style)'

[conda]
style = "fg:color_orange bg:color_bg3"
truncation_length = 0
# 优化：使用 palette 变量 color_green (原为硬编码 #08AD42，太亮了)
format = '[[ $symbol( $environment) ](fg:color_green bg:color_bg3)]($style)'
ignore_base = false

[cmd_duration]
min_time = 500
style = "fg:color_fg0 bg:color_bg1"
format = '[ $duration ]($style)'
show_milliseconds = false

[status]
style = "fg:color_red bg:color_bg1"
symbol = '✘'
not_executable_symbol = '🚫'
not_found_symbol = '🔍'
sigint_symbol = '🧱'
signal_symbol = '⚡'
format = '[ $symbol $status ]($style)'
recognize_signal_code = true
disabled = false
pipestatus_separator = '[ | ](fg:color_aqua bg:color_bg1)'
map_symbol = true
pipestatus = true
pipestatus_format = '[ \[$pipestatus\] [=>](fg:color_aqua bg:color_bg1) $symbol [$common_meaning](fg:color_purple bg:color_bg1)$signal_name$maybe_int]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_bg1"
format = '[[  $time ](fg:color_fg0 bg:color_bg1)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:color_green)'
error_symbol = '[](bold fg:color_red)'
vimcmd_symbol = '[](bold fg:color_green)'
vimcmd_replace_one_symbol = '[](bold fg:color_purple)'
vimcmd_replace_symbol = '[](bold fg:color_purple)'
vimcmd_visual_symbol = '[](bold fg:color_yellow)'
