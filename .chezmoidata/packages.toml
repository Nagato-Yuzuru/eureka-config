# darwin/amd64: no Intel bottle, and building it is not the point — mise's aqua
# backend takes the same upstream release binary. completions: brew's formula ships one and
# outranks the recipe on arm64; on amd64 the recipe is the only source.
[packages.ast-grep]
on = ["darwin"]
overrides = [{ when = "darwin/amd64", via = "mise" }]
completions = { ast-grep = "ast-grep completions zsh" }

[packages.duckdb]
on = ["darwin"]

[packages.cowsay]
on = ["darwin", "linux"]

[packages.figlet]
