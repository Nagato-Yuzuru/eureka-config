#:schema ../.schema/packages.json
# Everything installed on a machine, one table per package, whatever the backend.
# The types in tools/inventory/model.py are the schema (the #:schema line above is
# their JSON Schema, for the editor); `uv run render` compiles
# this (with platforms.toml and machines.toml) into .rendered/<machine>/, which
# chezmoi includes — ~/.Brewfile, mise's [tools], the install script's dnf and uv
# halves, the completion recipes. Bad data fails the render naming the entry.
#
#   key       package id; also its name on every backend unless a block renames it
#   on        list of machine tags it installs on: darwin, linux, or os/arch
#             (darwin/amd64, ...).
#   via       system (default: the platform's package manager, platforms.toml —
#             brew on macos, dnf on fedora) | mise | uv | upstream. The
#             discriminator: it decides which blocks may follow. Rule: one global
#             version -> system; multi-version -> mise; a Python CLI -> uv
#             (`uv tool install`); a bootstrap tool no package manager here can
#             supply -> upstream. mise and uv are themselves backends, so the
#             install script settles them in between: upstream commands run after
#             brew/dnf (where their own dependencies come from on a Linux box) and
#             before `uv tool install`. A package manager that fails on one package
#             does not abort the rest; it carries to the script's exit status.
#   brew      { name | cask }        system only; read on macos. A cask is a cask,
#                                    not a formula with a flag.
#   dnf       { name } + one source  system only; read on fedora. The source is
#             { copr | repofile }    the standard repos (nothing), a COPR repo
#                                    (owner/project) or a third-party .repo URL,
#                                    enabled/added first.
#   mise      { name | version | components }   via: mise only. name incl. the
#                                    backend prefix ("npm:pnpm"); version in mise's
#                                    syntax (default latest); components the extra
#                                    ones installed with the tool.
#   uv        { name | version }     via: uv only. name on PyPI; version spelled
#                                    `name@version`.
#   upstream  { command }            via: upstream only. The project's own
#                                    installer, run as written. It runs again
#                                    whenever this machine's rendered set changes,
#                                    so it must converge rather than assume a clean
#                                    machine — keep the installer's own skip or
#                                    overwrite behaviour. It installs; removing the
#                                    copy an old backend left is done by hand.
#   completions map of command -> sh command whose stdout is that command's zsh
#             completion. Compiled into ~/.config/mise/tasks/refresh-completions
#             (run by mise's postinstall hook, and by chezmoi whenever this
#             machine's recipe list changes); the files it writes sit LAST on
#             fpath, so a completion the package manager ships (brew formula,
#             Fedora rpm, zsh itself) always wins and a recipe only ever fills a
#             gap. Declare it on every mise or uv tool that has a generator
#             (nothing else ships those), and on a system tool only where some
#             backend was seen to ship none — say which, in a comment.
#             `mise run audit-completions` shows who provides what.
#             `clap_stub <cmd> '<gen>'` wraps a clap dynamic completer
#             (`COMPLETE=zsh <cmd>`) so it works as an fpath file.
#   overrides list of { when = <tag>, <field> = <value>, ... }; every entry whose
#             tag matches this machine is deep-merged over the line, in order
#             (maps merge, lists and scalars replace; switching `via` starts the
#             how afresh). This is the only per-machine mechanism, and it reaches
#             `via` and the blocks only — not `on`, not `completions` (fpath order
#             arbitrates per-backend differences).
#
# One [packages.<key>] table per package, one field per line; `completions` is
# inline when short, its own [packages.<key>.completions] table when not. The
# `# -- … --` lines only group; order is by hand.
#
# Not on linux on purpose (lab VM is a curated subset): git-cliff, ast-grep,
# duckdb, antidote (git-repo external, see .chezmoiexternal.toml.tmpl).

# -- shell & core -----------------------------------------------------------
[packages.git]
on = ["darwin", "linux"]

[packages.zsh]
on = ["linux"]

[packages.tmux]
on = ["darwin", "linux"]

[packages.neovim]
on = ["darwin", "linux"]

# completions: atim's COPR rpm ships none; brew's formula does.
[packages.starship]
on = ["darwin", "linux"]
dnf = { copr = "atim/starship" }
completions = { starship = "starship completions zsh" }

[packages.antidote]
on = ["darwin"]

# mise.run is the recommended source on macOS and Linux alike: the single-binary release is
# built with mise's optimised profile (the brew formula is slower and larger), and it is the
# only one `mise self-update` can advance — auto_update in dot_config/mise/config.toml.tmpl
# replaces the `brew upgrade`/`dnf upgrade`.
# completions: no installer ships one, so the recipe is load-bearing on every machine.
# Needs `usage` (below) at completion time.
[packages.mise]
on = ["darwin", "linux"]
via = "upstream"
upstream = { command = "curl https://mise.run | MISE_INSTALL_SKIP_IF_EXISTS=1 sh" }
completions = { mise = "mise completion zsh" }

# always latest, never multi-version — and needed by chezmoi's own scripts before mise tools exist.
# darwin/amd64: Homebrew builds no Intel bottle for uv, and only the standalone installer leaves
# `uv self update` working (a package-managed uv has it disabled). UV_NO_MODIFY_PATH keeps the
# installer out of the chezmoi-managed shell profiles, here and on every later self-update.
# completions: neither the standalone installer nor brew's formula ships one (no _uv in its
# site-functions), so the recipe is the only source on a Mac.
[packages.uv]
on = ["darwin", "linux"]
overrides = [
  { when = "darwin/amd64", via = "upstream", upstream = { command = "curl -LsSf https://astral.sh/uv/install.sh | UV_NO_MODIFY_PATH=1 sh" } },
]
completions = { uv = "uv generate-shell-completion zsh" }

[packages.make]
on = ["darwin", "linux"]

[packages.glibc-langpack-en]
on = ["linux"]

