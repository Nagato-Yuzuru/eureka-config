# -- Python CLIs (uv) ---------------------------------------------------------
# `uv tool install`, one isolated venv each, entry points in ~/.local/bin.
[packages.ruff]
on = ["darwin", "linux"]
via = "uv"
completions = { ruff = "ruff generate-shell-completion zsh" }

[packages.ty]
on = ["darwin", "linux"]
via = "uv"
completions = { ty = "ty generate-shell-completion zsh" }

# -- eBPF lab, linux only (system) --------------------------------------------
# kernel-devel never matches OrbStack's kernel, so everything here takes the
# BTF/CO-RE path. clang because libbpf's headers and `bpftool gen skeleton` are
# written against clang's BPF backend; gcc's is a separate cross compiler.
[packages.clang]
on = ["linux"]

[packages.clangd]
on = ["linux"]
dnf.name = "clang-tools-extra"

[packages.llvm] # llvm-strip -g, the DWARF strip every libbpf build ends with
on = ["linux"]

[packages.libbpf-devel]
on = ["linux"]

[packages.bpftool] # vmlinux.h, skeleton codegen, `feature probe`
on = ["linux"]

[packages.bpftrace]
on = ["linux"]

[packages.pahole]
on = ["linux"]
dnf = { name = "dwarves" }

[packages.elfutils-libelf-devel] # libbpf links against libelf and zlib
on = ["linux"]

# Fedora 44 has no zlib-devel
[packages.zlib-devel]
on = ["linux"]
dnf = { name = "zlib-ng-compat-devel" }

[packages.kernel-headers] # UAPI linux/bpf.h; need not match the running kernel
on = ["linux"]

[packages.strace] # loaders fail in userspace, before the verifier sees anything
on = ["linux"]

[packages.gdb]
on = ["linux"]
