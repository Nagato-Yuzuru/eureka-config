# -- dev toolchains (mise) ----------------------------------------------------
# No completions on go, node, cmake, typescript: zsh-users/zsh-completions ships
# _golang _node _cmake _tsc. None on usage, gopls, oxlint, oxfmt, actionlint, the
# language servers: nothing to generate.
[packages.go]
on = ["darwin", "linux"]
via = "mise"

# components: rustup's default profile ships neither, and both are what the
# editor needs (rust-src for std completion).
[packages.rust]
on = ["darwin", "linux"]
via = "mise"
mise = { version = "stable", components = ["rust-analyzer", "rust-src"] }

[packages.rust.completions]
rustup = "rustup completions zsh rustup"
# nightly's engine (rust-lang/cargo#14520) is dynamic — completes -p/--bin/
# --features from the workspace — and its script must be sourced, hence the
# stub; without a nightly toolchain, the toolchain's static _cargo.
cargo = "rustup toolchain list | grep -q '^nightly' && clap_stub cargo 'CARGO_COMPLETE=zsh cargo +nightly' || rustup completions zsh cargo"

[packages.deno]
on = ["darwin", "linux"]
via = "mise"
completions = { deno = "deno completions zsh" }

[packages.node]
on = ["darwin", "linux"]
via = "mise"
mise = { version = "lts" }

[packages.pnpm]
on = ["darwin", "linux"]
via = "mise"
completions = { pnpm = "pnpm completion zsh" }

[packages.golangci-lint]
on = ["darwin", "linux"]
via = "mise"
completions = { golangci-lint = "golangci-lint completion zsh" }

[packages.usage]
on = ["darwin", "linux"]
via = "mise"

[packages.cmake]
on = ["darwin", "linux"]
via = "mise"

[packages.just]
on = ["darwin", "linux"]
via = "mise"
completions = { just = "just --completions zsh" }

[packages.prek]
on = ["darwin", "linux"]
via = "mise"
completions = { prek = "clap_stub prek 'COMPLETE=zsh prek'" }

[packages.gopls]
on = ["darwin", "linux"]
via = "mise"
mise = { name = "go:golang.org/x/tools/gopls" }

# -- dev tools, workstation only (mise) ---------------------------------------
# terraform/opentofu: bash-protocol completion only (`complete -C`), wired in .zshrc.
[packages.opentofu]
on = ["darwin"]
via = "mise"

[packages.kubectl]
on = ["darwin"]
via = "mise"
completions = { kubectl = "kubectl completion zsh" }

[packages.k9s]
on = ["darwin"]
via = "mise"
completions = { k9s = "k9s completion zsh" }

[packages.buf]
on = ["darwin", "linux"]
via = "mise"
completions = { buf = "buf completion zsh" }

# act reads ~/.config/act/actrc even for `completion`, and its -P lines make it
# bail with "unknown shorthand flag" — point it at an empty config home.
[packages.act]
on = ["darwin"]
via = "mise"
completions = { act = "XDG_CONFIG_HOME=/var/empty act completion zsh" }

[packages.wrangler]
on = ["darwin"]
via = "mise"
completions = { wrangler = "wrangler complete zsh" }

[packages.hugo-extended]
on = ["darwin"]
via = "mise"
completions = { hugo = "hugo completion zsh" }

[packages.vacuum]
on = ["darwin"]
via = "mise"
completions = { vacuum = "vacuum completion zsh" }

[packages.actionlint]
on = ["darwin"]
via = "mise"

[packages.trivy]
on = ["darwin"]
via = "mise"
completions = { trivy = "trivy completion zsh" }

[packages.promql-langserver]
on = ["darwin"]
via = "mise"
mise = { name = "go:github.com/prometheus-community/promql-langserver/cmd/promql-langserver" }

[packages.lua-language-server]
on = ["darwin", "linux"]
via = "mise"

[packages.luarocks]
on = ["darwin", "linux"]
via = "system"

# TOML language server + linter: reads the #:schema line of each .chezmoidata file
# (.schema/, `uv run render schema`). No completion generator to declare.
[packages.taplo]
on = ["darwin"]
via = "mise"

[packages.typescript]
on = ["darwin"]
via = "mise"
mise = { name = "npm:typescript" }

[packages.oxlint]
on = ["darwin", "linux"]
via = "mise"

[packages.oxfmt]
