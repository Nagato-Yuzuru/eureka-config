# Everything installed on a machine, one line per package, whatever the backend.
# The types in tools/inventory/model.py are the schema; `uv run render` compiles
# this (with platforms.yaml and machines.yaml) into .rendered/<machine>/, which
# chezmoi includes — ~/.Brewfile, mise's [tools], the install script's dnf and uv
# halves, the completion recipes. Bad data fails the render naming the entry.
#
#   key       package id; also its name on every backend unless a block renames it
#   on        list of machine tags it installs on: darwin, linux, or os/arch
#             (darwin/amd64, ...).
#   via       system (default: the platform's package manager, platforms.yaml —
#             brew on macos, dnf on fedora) | mise | uv. The discriminator: it
#             decides which blocks may follow. Rule: one global version -> system;
#             multi-version -> mise; a Python CLI -> uv (`uv tool install`; uv
#             itself is a system package, so the install script runs it right
#             after brew/dnf).
#   brew      { name | cask }        system only; read on macos. A cask is a cask,
#                                    not a formula with a flag.
#   dnf       { name } + one source     system only; read on fedora. The source is
#             { copr | repofile }        the standard repos (nothing), a COPR repo
#                                    (owner/project) or a third-party .repo URL,
#                                    enabled/added first.
#   mise      { name | version | components }   via: mise only. name incl. the
#                                    backend prefix ("npm:pnpm"); version in mise's
#                                    syntax (default latest); components the extra
#                                    ones installed with the tool.
#   uv        { name | version }     via: uv only. name on PyPI; version spelled
#                                    `name@version`.
#   completions map of command -> sh command whose stdout is that command's zsh
#             completion. Compiled into ~/.config/mise/tasks/refresh-completions
#             (run by mise's postinstall hook, and by chezmoi whenever this
#             machine's recipe list changes); the files it writes sit LAST on
#             fpath, so a completion the package manager ships (brew formula,
#             Fedora rpm, zsh itself) always wins and a recipe only ever fills a
#             gap. Declare it on every mise or uv tool that has a generator
#             (nothing else ships those), and on a system tool only where some
#             backend was seen to ship none — say which, in a comment.
#             `mise run audit-completions` shows who provides what.
#             `clap_stub <cmd> '<gen>'` wraps a clap dynamic completer
#             (`COMPLETE=zsh <cmd>`) so it works as an fpath file.
#   overrides list of { $when: <tag>, <field>: <value>, ... }; every entry whose
#             tag matches this machine is deep-merged over the line, in order
#             (maps merge, lists and scalars replace; switching `via` starts the
#             how afresh). This is the only per-machine mechanism, and it reaches
#             `via` and the blocks only — not `on`, not `completions` (fpath order
#             arbitrates per-backend differences).
#
# Not on linux on purpose (lab VM is a curated subset): git-cliff, ast-grep,
# duckdb, antidote (git-repo external, see .chezmoiexternal.toml.tmpl).

packages:
  # -- shell & core -----------------------------------------------------------
  git: { on: [darwin, linux] }
  zsh: { on: [linux] }
  tmux: { on: [darwin, linux] }
  neovim: { on: [darwin, linux] }
  # completions: atim's COPR rpm ships none; brew's formula does.
  starship:
    {
      on: [darwin, linux],
      dnf: { copr: atim/starship },
      completions: { starship: "starship completions zsh" },
    }
  antidote: { on: [darwin] }
  # completions: jdx's rpm ships none; brew's formula does. Needs `usage` (below) at completion time.
  mise:
    {
      on: [darwin, linux],
      dnf: { repofile: https://mise.jdx.dev/rpm/mise.repo },
      completions: { mise: "mise completion zsh" },
    }
  uv: { on: [darwin, linux] } # always latest, never multi-version — and needed by chezmoi's own scripts before mise tools exist
  make: { on: [darwin, linux] }
  glibc-langpack-en: { on: [linux] }

  # -- cli tools --------------------------------------------------------------
  ripgrep: { on: [darwin, linux] }
  fd: { on: [darwin, linux], dnf: { name: fd-find } }
  jq: { on: [darwin, linux] }
  yq: { on: [darwin, linux] }
  jd: { on: [darwin] } # Fedora's "jd" is JDim, a 2ch browser — not the JSON diff tool
  bat: { on: [darwin, linux] }
  delta: { on: [darwin, linux], dnf: { name: git-delta } }
  zoxide: { on: [darwin, linux] }
  fzf: { on: [darwin, linux] }
  tree: { on: [darwin, linux] }
  bottom: { on: [darwin, linux], dnf: { copr: atim/bottom } }
  lazygit: { on: [darwin, linux], dnf: { copr: atim/lazygit } }
  yazi: { on: [darwin, linux], dnf: { copr: lihaohong/yazi } }
  gh: { on: [darwin, linux] }
  shellcheck: { on: [darwin, linux], dnf: { name: ShellCheck } }
  git-cliff: { on: [darwin] }
  ast-grep: { on: [darwin] }
  duckdb: { on: [darwin] }
  cowsay: { on: [darwin, linux] }
  figlet: { on: [darwin, linux] }
  lolcat: { on: [darwin, linux] }

  # -- macOS: GNU userland & system --------------------------------------------
  gawk: { on: [darwin] }
  grep: { on: [darwin] }
  gnu-sed: { on: [darwin] }
  coreutils: { on: [darwin] }
  macism: { on: [darwin], brew: { name: laishulu/homebrew/macism } }
  imagemagick: { on: [darwin] }
  docker: { on: [darwin] }

  # -- macOS apps ---------------------------------------------------------------
  ghostty: { on: [darwin], brew: { cask: ghostty } }
  # wezterm:         { on: [darwin], brew: { cask: wezterm@nightly } }
  raycast: { on: [darwin], brew: { cask: raycast } }
  # completions: casks ship none.
  1password-cli:
    { on: [darwin], brew: { cask: 1password-cli }, completions: { op: "op completion zsh" } }
  orbstack: { on: [darwin], brew: { cask: orbstack } }
  istat-menus: { on: [darwin], brew: { cask: istat-menus } }
  karabiner-elements: { on: [darwin], brew: { cask: karabiner-elements } }
  iina: { on: [darwin], brew: { cask: iina } }
  tailscale:
    {
      on: [darwin],
      brew: { cask: tailscale-app },
      completions: { tailscale: "tailscale completion zsh" },
    }

  # -- dev toolchains (mise) ----------------------------------------------------
  # No completions on go, node, cmake, typescript: zsh-users/zsh-completions ships
  # _golang _node _cmake _tsc. None on usage, gopls, oxlint, oxfmt, actionlint, the
  # language servers: nothing to generate.
  go: { on: [darwin, linux], via: mise }
  # components: rustup's default profile ships neither, and both are what the
  # editor needs (rust-src for std completion).
  rust:
    on: [darwin, linux]
    via: mise
    mise: { version: stable, components: [rust-analyzer, rust-src] }
    completions:
      rustup: rustup completions zsh rustup
      # nightly's engine (rust-lang/cargo#14520) is dynamic — completes -p/--bin/
      # --features from the workspace — and its script must be sourced, hence the
      # stub; without a nightly toolchain, the toolchain's static _cargo.
      cargo: rustup toolchain list | grep -q '^nightly' && clap_stub cargo 'CARGO_COMPLETE=zsh cargo +nightly' || rustup completions zsh cargo
  deno: { on: [darwin, linux], via: mise, completions: { deno: "deno completions zsh" } }
  node: { on: [darwin, linux], via: mise, mise: { version: lts } }
  pnpm:
    {
      on: [darwin, linux],
      via: mise,
      overrides: [{ $when: darwin/amd64, mise: { name: "npm:pnpm" } }],
      completions: { pnpm: "pnpm completion zsh" },
    }
  golangci-lint:
    {
      on: [darwin, linux],
      via: mise,
      completions: { golangci-lint: "golangci-lint completion zsh" },
    }
  usage: { on: [darwin, linux], via: mise }
  cmake: { on: [darwin, linux], via: mise }
  just: { on: [darwin, linux], via: mise, completions: { just: "just --completions zsh" } }
  prek:
    { on: [darwin, linux], via: mise, completions: { prek: "clap_stub prek 'COMPLETE=zsh prek'" } }
  gopls: { on: [darwin, linux], via: mise, mise: { name: "go:golang.org/x/tools/gopls" } }

  # -- dev tools, workstation only (mise) ---------------------------------------
  # terraform/opentofu: bash-protocol completion only (`complete -C`), wired in .zshrc.
  terraform: { on: [darwin], via: mise }
  opentofu: { on: [darwin], via: mise }
  kubectl: { on: [darwin], via: mise, completions: { kubectl: "kubectl completion zsh" } }
  k9s: { on: [darwin], via: mise, completions: { k9s: "k9s completion zsh" } }
  buf: { on: [darwin], via: mise, completions: { buf: "buf completion zsh" } }
  # act reads ~/.config/act/actrc even for `completion`, and its -P lines make it
  # bail with "unknown shorthand flag" — point it at an empty config home.
  act:
    {
      on: [darwin],
      via: mise,
      completions: { act: "XDG_CONFIG_HOME=/var/empty act completion zsh" },
    }
  wrangler: { on: [darwin], via: mise, completions: { wrangler: "wrangler complete zsh" } }
  hugo-extended: { on: [darwin], via: mise, completions: { hugo: "hugo completion zsh" } }
  vacuum: { on: [darwin], via: mise, completions: { vacuum: "vacuum completion zsh" } }
  actionlint: { on: [darwin], via: mise }
  trivy: { on: [darwin], via: mise, completions: { trivy: "trivy completion zsh" } }
  promql-langserver:
    {
      on: [darwin],
      via: mise,
      mise: { name: "go:github.com/prometheus-community/promql-langserver/cmd/promql-langserver" },
    }
  lua-language-server: { on: [darwin], via: mise }
  typescript: { on: [darwin], via: mise, mise: { name: "npm:typescript" } }
  oxlint: { on: [darwin, linux], via: mise }
  oxfmt: { on: [darwin, linux], via: mise }
  hcloud: { on: [darwin, linux], via: mise, completions: { hcloud: "hcloud completion zsh" } }

  # -- Python CLIs (uv) ---------------------------------------------------------
  # `uv tool install`, one isolated venv each, entry points in ~/.local/bin.
  ruff:
    { on: [darwin, linux], via: uv, completions: { ruff: "ruff generate-shell-completion zsh" } }
  ty: { on: [darwin, linux], via: uv, completions: { ty: "ty generate-shell-completion zsh" } }

  # -- eBPF lab, linux only (system) --------------------------------------------
  # kernel-devel never matches OrbStack's kernel, so everything here takes the
  # BTF/CO-RE path. clang because libbpf's headers and `bpftool gen skeleton` are
  # written against clang's BPF backend; gcc's is a separate cross compiler.
  clang: { on: [linux] }
  llvm: { on: [linux] } # llvm-strip -g, the DWARF strip every libbpf build ends with
  libbpf-devel: { on: [linux] }
  bpftool: { on: [linux] } # vmlinux.h, skeleton codegen, `feature probe`
  bpftrace: { on: [linux] }
  pahole: { on: [linux], dnf: { name: dwarves } }
  elfutils-libelf-devel: { on: [linux] } # libbpf links against libelf and zlib
  zlib-devel: { on: [linux], dnf: { name: zlib-ng-compat-devel } } # Fedora 44 has no zlib-devel
  kernel-headers: { on: [linux] } # UAPI linux/bpf.h; need not match the running kernel
  strace: { on: [linux] } # loaders fail in userspace, before the verifier sees anything
  gdb: { on: [linux] }
