# The test suite on each OS the dotfiles deploy to, with tools from that OS's package
# manager. workflow-scripts tests what other workflows run, on their runner image.
name: ci

"on":
  push:
    branches: [main]
  pull_request: {}

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install the tools the hooks and templates call
        run: brew install chezmoi shellcheck grep
      - run: make test

  fedora:
    runs-on: ubuntu-latest
    container: fedora:46@sha256:a9bab18d01cf2c2cf62f3e79c72623405bce14ac062995cc6651a3073c802e41
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Install the tools the hooks and templates call
        run: >-
          dnf install -y --setopt=install_weak_deps=False
          chezmoi git make jq ShellCheck nodejs python3 zsh findutils diffutils which
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # Not as root: root ignores the file modes the path gate's tests rely on.
      - name: make test
        run: |
          useradd -m tester
          chown -R tester .
          runuser -u tester -- env "PATH=$PATH" HOME=/home/tester \
            UV_CACHE_DIR=/home/tester/.cache/uv make test

  workflow-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Tests of the scripts workflows run
        run: uv run pytest -q tests/test_upstream_watch.py tests/test_vendor.py
