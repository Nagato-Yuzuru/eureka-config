# Checks for what runs on GitHub's runners: the workflows themselves, and the scripts they call
# tested on the runner image they run on. The rest of the suite runs in prek (make check).
name: ci

"on":
  push:
    branches: [main]
  pull_request: {}

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: jactionlint
        run: jactionlint
      - name: Tests of the scripts workflows run
        run: uv run --frozen pytest -q tests/test_upstream_watch.py tests/test_vendor.py
