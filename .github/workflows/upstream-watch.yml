# Weekly watch of upstreams our files were forked from but no longer track line by line: the
# principle-* skills came from cursor/plugins' pstack. The reviewed point lives in each entry's
# issues (contract in tools/upstream-watch.sh); closing the issue a run opens marks its head
# reviewed. An entry's first run needs a closed issue with its label carrying a
# `<!-- upstream-watch head=<sha> -->` marker.
name: upstream-watch

"on":
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch: {}

permissions: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - upstream: cursor/plugins
            pathspec: pstack/skills/principle-*/SKILL.md
            label: upstream-watch
            track: head
    concurrency:
      group: upstream-watch-${{ matrix.label }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      UPSTREAM: ${{ matrix.upstream }}
      PATHSPEC: ${{ matrix.pathspec }}
      LABEL: ${{ matrix.label }}
      TRACK: ${{ matrix.track }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Clone upstream
        run: git clone -q --filter=blob:none --no-checkout "https://github.com/$UPSTREAM" "$RUNNER_TEMP/upstream"
      - name: Diff upstream since the reviewed point
        run: bash tools/upstream-watch.sh "$RUNNER_TEMP/upstream"
