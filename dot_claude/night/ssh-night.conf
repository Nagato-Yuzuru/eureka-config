# Night ssh hardening. The owner Include's this at the TOP of ~/.ssh/config:
#
#   Include ~/.claude/night/ssh-night.conf
#
# Top placement is load-bearing: ssh keeps the FIRST value obtained for an
# option, so this Match must run before any Host block that sets
# IdentityAgent (the 1Password agent). While the night flag exists, ssh has
# no agent (the desktop app is locked and would hang until morning), no
# usable identities, and may not prompt: it dies in milliseconds with a
# readable "Permission denied" instead. IdentityFile /dev/null REPLACES the
# default on-disk key list (defaults apply only when no IdentityFile is
# configured) and IdentitiesOnly pins ssh to configured files — the
# property is enforced by ssh itself, not sampled by a preflight grep.
# Residual: an IdentityFile configured explicitly in a later Host block
# still ACCUMULATES onto the list; arming (`/night on`) verifies the
# effective list is exactly /dev/null and refuses to arm otherwise.
# Owner terminals hit this too at night, by design: the agent is unusable
# while the owner sleeps either way, and the flag only exists between
# /night on and /night off.
Match exec "test -e ~/.claude/night/active.json"
  IdentityAgent none
  BatchMode yes
  IdentityFile /dev/null
  IdentitiesOnly yes
