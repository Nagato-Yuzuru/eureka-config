version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - errorlint
    - err113
    - containedctx
    - contextcheck
    - exhaustive
    - gochecksumtype
    - bodyclose
    - noctx
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - nestif
    - revive
    - sloglint
  settings:
    sloglint:
      static-msg: true # variables go in attrs, not the message
    gocognit:
      min-complexity: 20
    exhaustive:
      default-signifies-exhaustive: false # a default case never satisfies exhaustiveness
    revive:
      rules:
        - name: context-as-argument
        - name: deep-exit
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - err113 # ad-hoc errors are fine in test bodies
          - gochecknoglobals

issues:
  uniq-by-line: false # report every finding, even on the same line

formatters:
  enable:
    - gofmt
